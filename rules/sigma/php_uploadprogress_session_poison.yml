title: Web server or PHP-FPM spawning a shell (possible PHP RCE follow-on)
id: 9b2e55d7-6c10-4f3a-8e44-109618109619bb
status: experimental
description: >
  A PHP / php-fpm / web-server worker spawning an interactive shell or network
  tool is a strong post-exploitation signal for any PHP RCE chain, including an
  include() sink fed by a poisoned session file.
references:
  - https://github.com/mikensec/php2shell-lab
author: php2shell-lab
date: 2026/10/21
logsource:
  category: process_creation
  product: linux
detection:
  parent:
    ParentImage|endswith:
      - '/php-fpm'
      - '/php'
      - '/apache2'
      - '/httpd'
      - '/nginx'
  child:
    Image|endswith:
      - '/sh'
      - '/bash'
      - '/dash'
      - '/nc'
      - '/ncat'
      - '/socat'
      - '/python'
      - '/python3'
      - '/perl'
  condition: parent and child
falsepositives:
  - Legitimate app features that shell out (build tools, imagemagick wrappers)
level: high
