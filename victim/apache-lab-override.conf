# LAB ONLY: scoped AllowOverride so /app and /api can carry their own
# .htaccess with a different session.serialize_handler, reproducing the
# "two apps, one shared session.save_path, mismatched handlers" setup
# that CVE-2026-109618/109619's handler-mismatch primitive needs. Nothing
# else under the docroot is affected.
<Directory /var/www/html/app>
    AllowOverride All
</Directory>
<Directory /var/www/html/api>
    AllowOverride All
</Directory>
