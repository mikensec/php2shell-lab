# PHP2Shell detection lab — offline, reproducible, bring-your-own-sample.
#
# This stack builds NO exploit. It stands up an instrumented PHP target and an
# analysis box on an isolated network so a defender can observe an untrusted PoC
# they supply themselves and extract detection artifacts (pcap, logs, traces).
#
#   ./lab.sh up                     # plain PHP target + attacker (profile: plain)
#   ./lab.sh up wordpress           # WordPress victim + DB + attacker (profile: wordpress)
#   ./lab.sh triage                 # static-only review of ./sample/*.py
#   ./lab.sh run ./sample/poc.py    # detonate under capture (you supply the PoC)
#   ./lab.sh collect                # write ./artifacts bundle
#   ./lab.sh down                   # tear down
#
# The `labnet` network is internal: containers reach each other and NOTHING else
# (no host, no internet). Do not remove `internal: true`.
#
# `analysis` (the attacker box) is always on. Targets are behind profiles so you
# pick one scenario at a time: `plain` (stock php) or `wordpress` (wp + mariadb).

services:
  target:
    profiles: ["plain"]
    container_name: php2shell-target
    # Pin the PHP version you are assessing once affected versions are published.
    # Example: PHP_TAG=8.3.35-apache  (defaults to a current patched tag so the
    # repo ships safe; override in .env to reproduce the vulnerable build YOURSELF).
    build:
      context: ./victim
      args:
        PHP_TAG: ${PHP_TAG:-8.3-apache}
    networks: [labnet]
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN]        # tcpdump inside the container only
    security_opt: ["no-new-privileges:true"]
    read_only: false
    tmpfs: ["/run", "/tmp"]
    volumes:
      - captures:/captures
    # no published ports: nothing is exposed to the host

  analysis:
    build: ./analysis
    container_name: php2shell-analysis
    hostname: analysis
    networks: [labnet]
    cap_drop: [ALL]
    cap_add: [NET_RAW, SYS_PTRACE]       # tcpdump + strace of the detonated PoC
    security_opt: ["no-new-privileges:true"]
    # The sample is mounted READ-ONLY and lives outside git (./sample is .gitignored).
    volumes:
      - ./sample:/sample:ro
      - ./artifacts:/artifacts
      - captures:/captures
    working_dir: /opt/lab
    # keep it alive; it does nothing until you invoke lab.sh
    command: ["sleep", "infinity"]
    pids_limit: 256
    mem_limit: 1g

  # --- WordPress scenario (profile: wordpress) -----------------------------
  # A realistic PHP victim. Stock WordPress + MariaDB, instrumented for capture.
  # No planted vulnerability. The attacker (analysis) fires the probe/PoC at it.
  wp-victim:
    profiles: ["wordpress"]
    container_name: php2shell-wp
    build:
      context: ./victim-wordpress
      args:
        WP_TAG: ${WP_TAG:-6.6-php8.3-apache}
    environment:
      WORDPRESS_DB_HOST: wp-db:3306
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp_lab_pw
      WORDPRESS_DB_NAME: wp
    depends_on: [wp-db]
    # labnet (internal) carries attacker<->victim traffic; edge (non-internal) exists
    # only so the host can browse WordPress. wp-db + analysis stay on labnet alone.
    networks: [labnet, edge]
    cap_drop: [ALL]
    # WordPress's first-run entrypoint (as root) unpacks core files and chowns them
    # to www-data (33:33) before Apache drops privileges — it needs these file/uid
    # caps or the container exits 2 on "Cannot change ownership". NET_RAW/NET_ADMIN
    # are for the in-container tcpdump.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - captures:/captures
      - wp-html:/var/www/html
    # Browse WordPress from the host at http://localhost:8080 (bound to loopback).
    # NOTE: this gives wp-victim a route off labnet (incl. internet egress) — it is
    # NOT air-gapped while published. Fine for driving the benign WP app; do not
    # detonate untrusted PoCs against a host-exposed victim.
    ports:
      - "127.0.0.1:8080:80"

  wp-db:
    profiles: ["wordpress"]
    container_name: php2shell-wp-db
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp_lab_pw
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    networks: [labnet]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - wp-db-data:/var/lib/mysql

networks:
  labnet:
    internal: true          # <-- the isolation. air-gapped from host + internet.
    driver: bridge
  edge:
    driver: bridge          # host-reachable; only wp-victim joins it, for port publish

volumes:
  captures:
  wp-html:
  wp-db-data:
